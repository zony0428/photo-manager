plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tetheract.pm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tetheract.pm'
        minSdk 26
        targetSdk 34
        versionCode 30203000
        versionName '2.3.0'
    }

    signingConfigs {
        release {
            def ksFile = file('../tetheract-release.jks')
            if (!ksFile.exists()) ksFile = file('../../.android_toolchain/tetheract-release.jks')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'tetheract_release_key'
                keyAlias 'tetheract'
                keyPassword 'tetheract_release_key'
                v1SigningEnabled true
                v2SigningEnabled true
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            def ksFile = file('../tetheract-release.jks')
            if (!ksFile.exists()) ksFile = file('../../.android_toolchain/tetheract-release.jks')
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
